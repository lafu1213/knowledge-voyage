        : `• 本單元題庫 ${unit.questions.length} 題，做過次數少的優先出現<br>
      • ${hasGen ? "加上程式隨機生成的題目，" : ""}不夠 ${SESSION_SIZE} 題時從橋連著的單元抽「跨單元複習」<br>`}
      • 選項順序每次重新洗牌${pend ? `<br>• 這個單元還有 <b style="color:var(--danger)">${pend}</b> 題錯題待訂正` : ""}
    </div>
    ${isTrial() ? `<div class="trial-note">👀 試玩模式：這次作答不會列入紀錄</div>` : ""}
    <button class="btn-primary" style="width:100%; padding:14px; font-size:1.05rem; margin-top:10px;" data-key="${escapeHtml(key)}" onclick="startQuiz(this.dataset.key)">⚔️ 開始闖關</button>`;
  openModal("quiz-modal");
}

function newQuizState(mode, subject, unit, questions) {
  return { mode, subject, unit, questions, idx: 0, correctCount: 0, combo: 0, maxCombo: 0, startTime: Date.now(), sid: (FINAL ? FINAL_SID : "") + uid(), pts: 0, recent: [] };
}

function startQuiz(key) {
  if (guardLocked()) return;
  document.getElementById("quiz-content").closest(".modal-box").className = "modal-box";
  const unit = WORLD.flatMap(s => s.units).find(u => u.key === key);
  quizState = newQuizState("練習", unit.subject, unit.unit, buildSession(unit));
  quizState.unitKey = key; quizState.flagBefore = flagLevel(unit);
  renderQuestion();
}

function sourceBadge(q) {
  if (q.crossFrom) return `<span class="src-badge">🔁 跨單元複習・${escapeHtml(q.crossFrom)}</span>`;
  if (q.src === "gen") return `<span class="src-badge">🎲 隨機生成</span>`;
  return "";
}

// ===== 期末：作答節奏與防亂答（試航版先記在這台裝置，之後改成雲端判斷）=====
function paceKey() { return "508_PACE_" + session.user.name; }
function paceState() {
  const today = nowStr().slice(0, 10);
  const st = load(paceKey(), null);
  return st && st.day === today ? st : { day: today, count: 0, doubleLeft: 0, lockUntil: (st && st.lockUntil) || 0, unlockSeen: (st && st.unlockSeen) || 0, lastAt: (st && st.lastAt) || 0 };
}
function paceOn() { return FINAL && !isTrial(); }
function guardLocked() {
  if (!paceOn()) return false;
  const left = paceState().lockUntil - Date.now();
  if (left <= 0) return false;
  toast(`⛓️ 船被扣押中，還有 ${Math.ceil(left / 60000)} 分鐘才能再答題。先去看看錯題的詳解吧！`, 4500);
  return true;
}
// 判斷這一題是不是亂答：太快作答，或連續 5 題都點同一個位置而且幾乎都錯
function isRushed(q, choice, ok) {
  const sec = (Date.now() - (quizState.shownAt || Date.now())) / 1000;
  const limit = PACE.fastSeconds + Math.min(3, Math.floor(String(q.q).length / 40));
  quizState.recent.push({ choice, ok });
  const last5 = quizState.recent.slice(-5);
  const samePos = last5.length === 5 && last5.every(r => r.choice === last5[0].choice) && last5.filter(r => r.ok).length <= 1;
  if (samePos) quizState.recent = [];
  return sec < limit ? "fast" : samePos ? "same" : "";
}
function applyPace(q, choice, ok, pts) {
  if (!paceOn()) return { pts, note: "", lock: false };
  const st = paceState();
  const why = isRushed(q, choice, ok);
  let note = "", lock = false;
  if (why) {
    st.count++; st.lastAt = Date.now();
    reportPace(why, st.count);
    if (ok) pts = 0; else pts *= 2;
    const reason = why === "fast" ? "你太快作答了，還沒看完題目" : "你連續好幾題都點同一個位置";
    if (st.count === 1) note = `⚠️ ${reason}！這題不加分，答錯扣分加倍。再兩次就會被扣押 ${PACE.lockMinutes} 分鐘喔！`;
    else if (st.count === 2) { st.doubleLeft = PACE.doubleCount; note = `⚠️ 第二次亂答！接下來 ${PACE.doubleCount} 題答錯都加倍扣分。再一次就會被扣押！`; }
    else { st.lockUntil = Date.now() + PACE.lockMinutes * 60000; lock = true; note = `⛓️ 今天第 ${st.count} 次亂答，船被扣押 ${PACE.lockMinutes} 分鐘！先停下來看看詳解吧。`; }
  } else if (!ok && st.doubleLeft > 0) {
    st.doubleLeft--; pts *= 2;
    note = `⚠️ 亂答處罰中：這題扣分加倍（還剩 ${st.doubleLeft} 題）`;
  }
  store(paceKey(), st);
  return { pts, note, lock };
}
// 「下一題」按鈕要等題目出現滿 20 秒才能按
function startPaceTimer() {
  if (!paceOn()) return;
  const btn = document.getElementById("next-btn"), noteEl = document.getElementById("pace-note");
  if (!btn) return;
  const label = btn.textContent;
  const tick = () => {
    const left = Math.ceil(PACE.minSeconds - (Date.now() - quizState.shownAt) / 1000);
    if (!document.body.contains(btn)) return clearInterval(timer);
    if (left > 0) { btn.disabled = true; btn.textContent = `⏳ ${left} 秒後可以下一題`; if (noteEl) noteEl.textContent = `每題至少停留 ${PACE.minSeconds} 秒，先把詳解看完吧！`; }
    else { btn.disabled = false; btn.textContent = label; if (noteEl) noteEl.textContent = ""; clearInterval(timer); }
  };
  const timer = setInterval(tick, 250);
  tick();
}

// 數學題的分數用上下排的方式顯示：「2又3/4」→ 2 又 四分之三
function mathHtml(text, subject) {
  const h = escapeHtml(text);
  if (subject !== "數學") return h;
  const fr = (n, d) => `<span class="frac" aria-label="${d}分之${n}"><span>${n}</span><span>${d}</span></span>`;
  return h.replace(/(\d+)又(\d+)\/(\d+)/g, (m, w, n, d) => `${w}${fr(n, d)}`)
          .replace(/(\d+)\/(\d+)/g, (m, n, d) => fr(n, d));
}

function renderQuestion() {
  const q = quizState.questions[quizState.idx];
  quizState.shownAt = Date.now();
  const total = quizState.questions.length;
  document.getElementById("quiz-content").innerHTML = `
    <div class="q-head">
      <span>📍 ${escapeHtml(q.subject)}・${escapeHtml(q.unit)}｜【${escapeHtml(q.type)}】${q.diagram && SVG_DIAGRAMS[q.diagram] ? "📊 含圖解" : ""}${questionImageUrl(q) ? "🖼️ 含圖" : ""}${questionSpeech(q) ? "🎧 英聽" : ""}${q.src !== "gen" && stats.byId && !stats.byId[q.id] ? `<span class="src-badge" style="background:rgba(245,158,11,.15);color:#b45309;border-color:rgba(245,158,11,.4)">🆕 第一次作答</span>` : ""}${sourceBadge(q)}</span>
      <span>🔥 連擊 x${quizState.combo}｜第 ${quizState.idx + 1} / ${total} 題</span>
    </div>
    <div class="bar"><i style="width:${Math.round(quizState.idx / total * 100)}%"></i></div>
    ${quizState.mode === "訂正" ? `<div class="trial-note" style="background:#fee2e2;color:#991b1b">👾 錯題訂正中：答對就能把這題從待訂正消滅（歷史紀錄會留著）</div>` : ""}
    ${quizState.mode === "複習" ? `<div class="trial-note" style="background:#e0e7ff;color:#3730a3">📚 歷史錯題複習：答對 +${SCORE_RULES.reviewOk}，又錯 ${SCORE_RULES.reviewWrong} 並回到待訂正</div>` : ""}
    ${q.passage ? `<details class="passage" ${quizState.lastPassage === q.passage ? "" : "open"}><summary>📖 ${q.subject === "國語" ? "課文" : "文章"}（點一下收合／展開）</summary><div>${escapeHtml(q.passage)}</div></details>` : ""}
    ${listenBoxHtml(q, true)}
    ${questionImageHtml(q)}
    <h3 style="margin:16px 0 10px; line-height:1.6; white-space:pre-line;">Q${quizState.idx + 1}. ${mathHtml(q.q, q.subject)}</h3>
    <div id="opts-box">${q.opts.map((o, i) => `<button class="option-btn" onclick="submitAnswer(${i})">${mathHtml(o, q.subject)}</button>`).join("")}</div>
    <div id="feedback-box" style="margin-top:12px;"></div>`;
  if (questionSpeech(q)) setTimeout(() => speakCurrent(false), 350);
  else if ("speechSynthesis" in window) speechSynthesis.cancel();
}

function submitAnswer(choice) {
  const q = quizState.questions[quizState.idx];
  quizState.lastPassage = q.passage || "";
  const btns = document.querySelectorAll("#opts-box .option-btn");
  btns.forEach(b => (b.disabled = true));
  const ok = choice === q.ans;
  if (ok) { quizState.correctCount++; quizState.combo++; quizState.maxCombo = Math.max(quizState.maxCombo, quizState.combo); }
  else quizState.combo = 0;
  const pace = applyPace(q, choice, ok, answerPoints(q, ok, quizState.mode, quizState.combo));
  const pts = pace.pts;
  quizState.locked = pace.lock;
  const wasRepeat = !ok && quizState.mode !== "訂正" && pts === SCORE_RULES.wrongAgain;
  quizState.pts += pts;
  const lvBefore = getLevelInfo(stats.score).lv;

  saveRecord({
    t: nowStr(), subject: q.subject, unit: q.unit, qId: q.id, q: q.q, opts: q.opts.map(stripNum),
    chosen: stripNum(q.opts[choice]), correctText: stripNum(q.opts[q.ans]), ok, mode: quizState.mode,
    exp: q.exp || "", sid: quizState.sid, uid: uid(), pts
  });
  const lvAfter = getLevelInfo(stats.score).lv;
  const lvNote = isTrial() || lvAfter === lvBefore ? "" : lvAfter > lvBefore
    ? `<div class="lv-note up">🎉 升級了！現在是 Lv.${lvAfter} ${getLevelInfo(stats.score).title}${FINAL ? `　🪙 +${COIN.levelUp}` : ""}</div>`
    : `<div class="lv-note down">⚠️ 降級了…現在是 Lv.${lvAfter}，把錯題訂正好就能升回來！</div>`;
  const gotCoin = FINAL && !isTrial() ? coinForAnswer(myRows[myRows.length - 1] || {}) : 0;
  const ptsNote = isTrial() ? "" : `<span class="pts ${pts >= 0 ? "plus" : "minus"}">${fmtPts(pts)} 分</span>${gotCoin ? `<span class="pts plus coin-gain">🪙 +${gotCoin}</span>` : ""}${wasRepeat ? `<span style="font-size:.8rem;">（這題以前錯過，一錯再錯扣更多）</span>` : ""}`;

  btns[q.ans].classList.add("correct");
  btns[q.ans].insertAdjacentText("beforeend", " ⬅ 正確答案");
  if (!ok) { btns[choice].classList.add("wrong"); btns[choice].insertAdjacentText("beforeend", " ⬅ 你的選擇"); }
  const last = quizState.idx + 1 >= quizState.questions.length;
  document.getElementById("feedback-box").innerHTML = `
    <div class="lore-box" style="border-left-color:${ok ? "#16a34a" : "#dc2626"}; background:${ok ? "rgba(22,163,74,0.1)" : "rgba(220,38,38,0.1)"}">
      <div style="font-weight:900; color:${ok ? "#15803d" : "#b91c1c"};">${ptsNote} ${ok ? (quizState.mode === "訂正" ? "🎉 訂正成功！這題已從錯題本消滅" : "🎉 答對了！觀念很清楚！") : `💡 答錯囉！正確答案是【${escapeHtml(stripNum(q.opts[q.ans]))}】${isTrial() ? "" : "（已加入錯題本）"}`}</div>
      ${q.exp ? `<div style="margin-top:6px;">📝 <b>詳解：</b>${mathHtml(q.exp, q.subject)}</div>` : ""}
    </div>
    ${pace.note ? `<div class="rush-warn">${escapeHtml(pace.note)}</div>` : ""}
    ${lvNote}
    ${q.diagram && SVG_DIAGRAMS[q.diagram] ? SVG_DIAGRAMS[q.diagram] : ""}
    <button id="next-btn" class="btn-primary" style="width:100%; padding:12px; margin-top:6px;" onclick="nextQuestion()">${pace.lock ? "⛓️ 結束這一局" : last ? "🏁 看本局成績" : "➡️ 看懂了，下一題"}</button>
    <div id="pace-note" class="pace-note"></div>`;
  startPaceTimer();
  renderPills();
}

function nextQuestion() {
  if (quizState.locked) { finishQuiz(true); return; }
  if (quizState.mode === "練習" && !isTrial() && stats.pending.length >= LOCK_LIMIT) {
    finishQuiz(true);
    return;
  }
  quizState.idx++;
  if (quizState.idx < quizState.questions.length) renderQuestion();
  else finishQuiz(false);
}

function finishQuiz(lockedOut) {
  pirateChance = !lockedOut;
  const done = lockedOut ? quizState.idx + 1 : quizState.questions.length;
  const sec = Math.max(5, Math.round((Date.now() - quizState.startTime) / 1000));
  const acc = done ? quizState.correctCount / done : 0;
  const reading = quizState.mode === "練習" && readingBoost(quizState.subject, quizState.unit);
  const bonus = sessionBonus(quizState.correctCount, done) * (reading && quizState.correctCount / done >= 0.8 ? READ.ptsMul : 1);
  const score = bonus;
  saveRecord(null, {
    t: nowStr(), subject: quizState.subject, unit: quizState.mode === "練習" ? quizState.unit : quizState.mode === "挑戰" ? CHALLENGE_TAG + quizState.unit : quizState.mode === "訂正" ? "錯題本" : "歷史錯題複習",
    total: done, correct: quizState.correctCount, score, sid: quizState.sid
  });
  const lv = getLevelInfo(stats.score);
  const stars = acc === 1 ? 3 : acc >= 0.7 ? 2 : acc >= 0.4 ? 1 : 0;
  document.getElementById("quiz-content").innerHTML = `
    <div style="text-align:center;">
      <div style="font-size:3.2rem;">${lockedOut ? "⚠️" : "🏆"}</div>
      <h2>${quizState.locked ? "⛓️ 船被扣押了！先看詳解，休息一下再出航" : lockedOut ? "錯題已滿 10 題，先去訂正！" : quizState.mode === "挑戰" ? (acc === 1 && done >= CHALLENGE.size ? "🏁 挑戰考全對！" : `🏁 挑戰考答對 ${quizState.correctCount}／${done}，差一點點！`) : quizState.mode === "訂正" ? "錯題訂正完成！" : quizState.mode === "複習" ? "歷史錯題複習完成！" : "單元闖關完成！"}</h2>
      ${quizState.mode === "挑戰" && !(acc === 1 && done >= CHALLENGE.size) && !isTrial() && !lockedOut ? `<div class="flag-box">挑戰考要 ${CHALLENGE.size} 題全部答對才算通過。答錯的題目已經放進${FINAL ? WRECK : "錯題島"}，先把它們訂正好，${CHALLENGE.cooldownMin} 分鐘後再來挑戰！</div>` : ""}
      ${quizState.mode === "練習" && !lockedOut ? `<div style="font-size:2rem; letter-spacing:4px;">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>` : ""}
      <div class="lore-box" style="text-align:left;">
        • 答對 <b>${quizState.correctCount} / ${done}</b> 題（正確率 ${Math.round(acc * 100)}%）<br>
        • 作答 <b>${sec}</b> 秒・最高連擊 <b>x${quizState.maxCombo}</b><br>
        • 每題加減分合計 <b>${fmtPts(quizState.pts)}</b>，結算${bonus > 0 ? "獎勵" : bonus < 0 ? "扣分" : ""} <b>${fmtPts(bonus)}</b><br>
        • 本局共 <b style="color:${quizState.pts + bonus >= 0 ? "var(--accent)" : "var(--danger)"}; font-size:1.15rem;">${fmtPts(quizState.pts + bonus)} 分</b>${isTrial() ? "（試玩不列入紀錄）" : ""}
      </div>
      ${isTrial() ? "" : `<div style="background:linear-gradient(135deg,#1e3a8a,#3b82f6); color:#fff; padding:16px; border-radius:16px; margin:12px 0;">
        <div style="font-size:.85rem; opacity:.9;">目前等級</div><div style="font-size:1.6rem; font-weight:900;">⭐ Lv.${lv.lv}｜${lv.title}</div>
        <div style="font-size:.85rem;">累計 ${stats.score} 分</div></div>`}
      ${reading && !isTrial() ? (FINAL ? readingResultHtml(acc, done) : `<div class="reading-reward">📖 <b>閱讀島加碼</b>：答對分數 ×${READ.ptsMul}${acc >= 0.8 && done >= READ.minQ ? `，結算獎勵也 ×${READ.ptsMul}` : "，一場答對 80% 以上結算獎勵也加倍！"}</div>`) : ""}
      ${flagResultHtml()}
      <button class="btn-primary" style="width:100%; padding:12px;" onclick="${lockedOut ? "openMistakeBook('pending')" : "closeQuiz()"}">${lockedOut ? "🌋 前往錯題島" : "🗺️ 回到地圖"}</button>
    </div>`;
  if (FINAL && reading && !isTrial() && !lockedOut && !quizState.locked) maybeTreasure(acc, done);
}
function flagResultHtml() {
  if (isTrial() || (quizState.mode !== "練習" && quizState.mode !== "挑戰") || !quizState.unitKey) return "";
  const unit = WORLD.flatMap(s => s.units).find(u => u.key === quizState.unitKey);
  const now = unit ? flagLevel(unit) : 0;
  if (!unit || now <= (quizState.flagBefore || 0)) return "";
  const subj = WORLD.find(s => s.key === unit.subject), fl = subjectFlags(subj);
  return `<div class="flag-win ${now === 2 ? "gold" : ""}"><div class="flag-win-icon">${now === 2 ? "👑" : "🚩"}</div>
    <div><b>${now === 2 ? "征服成功！金旗升起，全部星星到手！" : "插旗成功！這座島被你拿下了！"}</b><br>
    <small>${escapeHtml(splitUnit(unit.unit)[1] || unit.unit)}　・　${escapeHtml(unit.subject)}已插旗 ${fl.got}/${fl.total} 座島${fl.got === fl.total ? "，全島制霸！" : ""}</small></div></div>`;
}
function readingResultHtml(acc, done) {
  const today = nowStr().slice(0, 10), unit = quizState.unit;
  const already = mySessions.filter(x => x.unit === unit && String(x.t).slice(0, 10) === today && x.total >= READ.minQ && x.correct / x.total >= 0.8).length > 1;
  return `<div class="reading-reward">📖 <b>閱讀島加碼</b>：答對分數和金幣都 ×2${acc >= 0.8 && done >= READ.minQ ? `，結算獎勵也 ×2${already ? "（今天這座島的 🪙 +" + READ.bonusCoins + " 已經領過了）" : `，再送 🪙 +${READ.bonusCoins}`}` : "。一場答對 80% 以上，還會再送金幣、有機會撈到稀有寶物！"}
    <div id="treasure-slot"></div></div>`;
}
/** 閱讀島寶物：一天最多一件；第一次全對必得星光船帆，其他時候全對 50%、80% 以上 25% 撈到珍珠護符 */
async function maybeTreasure(acc, done) {
  if (done < READ.minQ || acc < 0.8) return;
  if (paceState().lastAt > quizState.startTime) return;   // 這一場有亂答就不給寶物
  const today = nowStr().slice(0, 10);
  if (coinRows.some(r => r.op === "treasure" && String(r.t).slice(0, 10) === today)) {
    const slot = document.getElementById("treasure-slot");
    if (slot) slot.innerHTML = `<div class="treasure-note">🐚 今天已經撈過一件稀有寶物了，明天再來挑戰！</div>`;
    return;
  }
  const inv = inventory();
  let item = null;
  if (acc === 1 && !inv["sail-star"]) item = "星光船帆";
  else if (Math.random() < (acc === 1 ? READ.perfectChance : READ.goodChance) || window.TREASURE_TEST) item = "珍珠護符";
  const slot = () => document.getElementById("treasure-slot");
  if (!item) { if (slot()) slot().innerHTML = `<div class="treasure-note">🌊 這次沒有撈到寶物……${acc === 1 ? "" : "全部答對機會更大喔！"}</div>`; return; }
  try {
    if (!DEMO) await flushQueue();   // 先把這一場的紀錄送上雲端，後端才能確認
    await coinOp("treasure", 0, item);
    const it = itemById(item);
    if (it.kind) equipDecor(it.kind, it.id, true);
    if (slot()) slot().innerHTML = `<div class="treasure-found"><div class="treasure-icon">${it.icon ? itemIcon(it, 64) : "⛵"}</div>
      <div><b>🎉 撈到稀有寶物：${item}！</b><br><small>${it.desc || "已經換到你的船上了！"}</small></div></div>`;
    toast(`🎉 閱讀島寶物：${item}！`, 4500);
  } catch (e) {
    if (slot()) slot().innerHTML = `<div class="treasure-note">⚠️ 寶物沒有送出：${escapeHtml(e.message)}</div>`;
  }
}

function closeQuiz() {
  closeModal("quiz-modal");
  renderAll();
  if (pirateChance) { pirateChance = false; setTimeout(() => maybePirate("finish"), 900); }
}

// =========================================================
// 9. 錯題島：待訂正（清完才能繼續冒險）＋ 歷史錯題（訂正過也會留著，隨時可以再複習）
// =========================================================
function questionObjects(list) {
  return list.map(p => {
    const q = findQuestion(p.qId);
    if (q) return q;
    const ans = (p.opts || []).indexOf(p.correctText);
    return ans >= 0 ? { id: p.qId, subject: p.subject, unit: p.unit, type: "錯題", q: p.q, opts: p.opts, ans, exp: p.exp, src: "snap" } : null;
  }).filter(Boolean);
}
function pendingQuestionObjects() { return questionObjects(stats.pending); }

let mistakeView = { tab: "pending", subject: "全部" };

function openMistakeBook(tab) {
  if (tab) mistakeView.tab = tab;
  const box = document.getElementById("quiz-content");
  openModal("quiz-modal");
  box.closest(".modal-box").className = "modal-box" + (FINAL ? " wreck" : "");
  if (isTrial()) {

          ${questionImageHtml(q)}
        </div>`;
      }).join("")}

}

function startMistakeRetry() {
  if (guardLocked()) return;
  const list = shuffle(pendingQuestionObjects()).slice(0, SESSION_SIZE).map(q => prepareQuestion(q));
  quizState = newQuizState("訂正", "錯題本", "錯題本", list);
  renderQuestion();
}

function startReview() {
  if (guardLocked()) return;
  const pool = stats.wrongEver.filter(q => mistakeView.subject === "全部" || q.subject === mistakeView.subject)
    .sort((a, b) => b.wrong - a.wrong).slice(0, SESSION_SIZE * 2);
  const list = shuffle(questionObjects(shuffle(pool).sort((a, b) => b.wrong - a.wrong).slice(0, SESSION_SIZE))).map(q => prepareQuestion(q));
  if (!list.length) return;
  quizState = newQuizState("複習", "錯題本", "歷史錯題複習", list);
  renderQuestion();
}

function demoDashboard(student) {
  const students = rosterList.filter(a => a.role === "student");
  const isF = r => String(r.sid || "").indexOf(FINAL_SID) === 0, want = dashState.season === "final";
  const statsOf = name => { const d = load("508_DEMO_DATA_" + name, { answers: [], sessions: [] }); return aggregate(d.answers.filter(r => isF(r) === want), d.sessions.filter(r => isF(r) === want)); };
  const u = session.user;
  if (u.role === "parent") {
    const kid = students.find(s => s.name === u.child);
    return { scope: "parent", detail: { name: kid.name, seat: kid.seat, stats: statsOf(kid.name) } };
  }
  const pick = students.find(s => s.name === (student || dashState.student)) || students[0];
  return {
    scope: "teacher",
    summary: students.map(s => { const st = statsOf(s.name); return { seat: s.seat, name: s.name, attempts: st.attempts, correct: st.correct, score: st.score, pending: st.pending.length, repeated: st.repeated.length, lastActive: st.lastActive,
      stars: st.stars, rightIds: st.questions.filter(q => q.correct > 0).map(q => q.qId), doneIds: st.questions.map(q => q.qId) }; }),
    detail: { name: pick.name, seat: pick.seat, stats: statsOf(pick.name) }

}

const DASH_TABS = [
  ["repeated", "🔁 一錯再錯"], ["pending", "👾 還沒訂正"], ["wrongEver", "❌ 答錯過的題目"], ["right", "✅ 答對的題目"], ["units", "📚 各科單元"]
];

function detailHtml(det) {
  const st = det.stats;
  const acc = st.attempts ? Math.round(st.correct / st.attempts * 100) : 0;
  const fixTries = st.questions.reduce((t, q) => t + q.fixTries, 0), fixes = st.questions.reduce((t, q) => t + q.fixes, 0);
  const byId = {}; st.questions.forEach(q => { byId[q.qId] = q; });
  const lvInfo = getLevelInfo(st.score || 0), sum = starSummary({ stars: st.stars || {}, byId });
  const lists = {
    repeated: st.repeated.slice().sort((a, b) => b.wrong - a.wrong),
    pending: st.pending,
    wrongEver: st.questions.filter(q => q.wrong > 0).sort((a, b) => b.wrong - a.wrong),
    right: st.questions.filter(q => q.correct > 0 && q.last === true)
  };
  const tab = dashState.tab;
  let body;
  if (tab === "units") {
    const islands = WORLD.flatMap(s => s.units).map(u => ({ u, a: (st.stars || {})[u.key] || 0, c: unitCoverage(u, { byId }) }));
    body = `<div class="lore-box" style="font-size:.86rem"><b>各島星星</b><br>${islands.map(x => `<span style="display:inline-block; margin:2px 10px 2px 0">${escapeHtml(x.u.subject)}・${escapeHtml(x.u.unit)} ${"⭐".repeat(x.a)}${"🌟".repeat(x.c.stars)}${x.a + x.c.stars ? "" : "—"}</span>`).join("")}</div>` + (st.units.length ? st.units.map(u => {
      const p = Math.round(u.correct / u.total * 100);
      return `<div class="subj-row"><div><span>${escapeHtml(u.subject)}・${escapeHtml(u.unit)}</span><span>${p}%（${u.correct}/${u.total}）</span></div><div class="bar"><i style="width:${p}%; background:${p < 65 ? "#dc2626" : ""}"></i></div></div>`;
    }).join("") : `<div class="empty-note">還沒有作答紀錄</div>`);
  } else {
    const list = lists[tab];
    body = list.length ? list.map(qRowHtml).join("") : `<div class="empty-note">${tab === "repeated" ? "太棒了，沒有一錯再錯的題目！" : tab === "pending" ? "錯題都訂正完了！" : "還沒有資料"}</div>`;
  }
  return `
    <h3 style="margin:18px 0 4px;">📌 ${escapeHtml(det.seat)} 號 ${escapeHtml(shortName(det.name))} ${lvPill(st.score)} <span style="font-size:.85rem">${escapeHtml(lvInfo.title)}</span></h3>
    <div class="kpis">
      <div class="tile-kpi"><b>Lv.${lvInfo.lv}</b><span>等級（${st.score || 0} 分）</span></div>
      <div class="tile-kpi"><b>⭐${sum.acc} 🌟${sum.comp}</b><span>星星 共 ${sum.total}／${sum.max}</span></div>
      <div class="tile-kpi"><b>${st.attempts}</b><span>作答題次</span></div>
      <div class="tile-kpi"><b>${st.attempts ? acc + "%" : "—"}</b><span>正確率</span></div>
      <div class="tile-kpi"><b style="color:var(--danger)">${st.pending.length}</b><span>還沒訂正</span></div>
      <div class="tile-kpi"><b style="color:var(--danger)">${st.repeated.length}</b><span>一錯再錯的題目</span></div>
      <div class="tile-kpi"><b>${fixTries}</b><span>訂正次數（成功 ${fixes}）</span></div>
      <div class="tile-kpi"><b>${escapeHtml(st.lastActive || "—")}</b><span>最後作答</span></div>
    </div>
    <div class="tabs">${DASH_TABS.map(([k, label]) => `<button class="${k === tab ? "on" : ""}" onclick="dashState.tab='${k}'; renderDashboard();">${label}${k !== "units" ? `（${lists[k].length}）` : ""}</button>`).join("")}</div>
    <div>${body}</div>`;
}

function qRowHtml(q) {
  const status = q.last === false ? `<span class="chip red">待訂正</span>` : q.wrong ? `<span class="chip green">已訂正</span>` : `<span class="chip green">全對</span>`;
  return `<div class="q-row">
    <div class="meta">${status}${q.wrong >= 2 ? `<span class="chip red">錯 ${q.wrong} 次</span>` : ""}
      <span>${escapeHtml(q.subject)}・${escapeHtml(q.unit)}</span>
      <span>作答 ${q.attempts} 次・對 ${q.correct}・錯 ${q.wrong}・訂正 ${q.fixTries} 次${q.fixTries ? `（成功 ${q.fixes}）` : ""}</span></div>
    <div>${escapeHtml(q.q)}</div>
    <div style="color:var(--success); font-weight:800;">✔ 正確答案：${escapeHtml(q.correctText)}</div>
    ${q.wrongAnswers.length ? `<div style="color:var(--danger); font-size:.82rem;">✘ 曾經選過：${q.wrongAnswers.map(escapeHtml).join("、")}</div>` : ""}
  </div>`;
}

const CHAT_QUICK = ["👋 嗨！", "要不要來比賽？⚔️", "我拿三顆星了！⭐", "錯題島見！🌋", "加油！💪", "好難喔 😵"];

const net = {
  others: [], messages: [], battle: null, timer: null, sig: "",
  start() {
    this.stop();
    this.others = []; this.messages = []; this.battle = null; this.sig = "";
    this.heartbeat();
    this.timer = setInterval(() => { if (!document.hidden) this.heartbeat(); }, 4000);
  },
  stop() { clearInterval(this.timer); this.timer = null; },
  async call(action, data) { return DEMO ? demo[action](data) : api(action, data); },
  async heartbeat() {
    if (!session) return;
    try {
      const since = this.messages.length ? this.messages[this.messages.length - 1].id : 0;
      this.apply(await this.call("presence", { place: myPlace(), since, emoji: myEmoji(), color: myColor(), lv: session.user.role === "student" ? getLevelInfo(stats.score).lv : 0, battleOn: battleOn() }));
    } catch (e) { /* 網路斷掉時下次再試 */ }
  },
  apply(r) {
    if (!r) return;
    this.others = (r.others || []).filter(o => o.name !== session.user.name);
    const known = new Set(this.messages.map(m => m.id));
    (r.messages || []).forEach(m => { if (!known.has(m.id)) this.messages.push(m); });
    this.messages = this.messages.slice(-40);
    this.battle = r.battle || null;
    applyBridgePulse(r.bridge || (DEMO && FINAL ? demoBridge("pulse") : null));
    const sig = this.others.map(o => o.name + o.place + o.emoji).join("|");
    if (sig !== this.sig) { this.sig = sig; renderSide(); }
    if (!walking) renderAvatars();
    renderChat();
    renderBattle();
  },
  async chat(text) { this.apply(await this.call("chat", { text, place: myPlace(), since: this.lastId() })); },
  lastId() { return this.messages.length ? this.messages[this.messages.length - 1].id : 0; },
  async battleOp(op, extra = {}) { this.apply(await this.call("battle", Object.assign({ op, place: myPlace(), since: this.lastId() }, extra))); },
  async saveProfile(p) { return this.call("saveProfile", p); },
  async loadProfile() { return this.call("getProfile", {}); }
};

  peer: null, threads: [], msgs: [], pace: null, mistakes: null, picked: new Set() };
const BRIDGE_TABS = [["overview", "🧭 總覽"], ["rules", "🏴‍☠️ 航海規則"], ["coins", "🪙 發金幣"], ["dm", "📩 私訊"], ["pace", "⛓️ 亂答紀錄"], ["mistakes", "📚 分科錯題"]];
const DEFAULT_RULES = { pirateOn: true, afterSchoolOnly: false, schoolStart: "07:40", schoolEnd: "16:00" };

function bridgeCall(op, data = {}) { return DEMO ? Promise.resolve(demoBridge(op, data)) : api("bridge", Object.assign({ op }, data)); }
async function loadBridgeRules() {

function rulesNow() { return Object.assign({}, DEFAULT_RULES, bridgeState.rules || {}); }
/** 上課時間：週一到週五、老師設定的上下課時間之間 */
function inSchoolHours(r) {
  const s = nowStr(), day = new Date(s.slice(0, 10) + "T12:00:00").getDay(), hm = s.slice(11, 16);
  return day >= 1 && day <= 5 && hm >= r.schoolStart && hm < r.schoolEnd;
}
function pirateAllowed() {
  const r = rulesNow();
  if (!r.pirateOn) return false;
  return !(r.afterSchoolOnly && inSchoolHours(r));
}
function pirateStatusText(r = rulesNow()) {
  if (!r.pirateOn) return "⛔ 海盜已關閉，現在不會出現";
  if (r.afterSchoolOnly) return inSchoolHours(r) ? `🏫 上課時間（${r.schoolStart}～${r.schoolEnd}），海盜休息中` : "🏴‍☠️ 放學時間，海盜出沒中";
  return "🏴‍☠️ 海盜出沒中（隨時可能出現）";
}

/** 每 4 秒的回報帶回來的：未讀私訊、老師解除扣押、航海規則 */
function applyBridgePulse(p) {
  if (!p || !FINAL || !session) return;
  if (p.rules) bridgeState.rules = p.rules;
  const before = bridgeState.unread;
  bridgeState.unread = p.unread || 0;
  if (bridgeState.unread > before) {
    const open = document.getElementById("bridge-modal").classList.contains("open");
    if (open && (session.user.role === "student" || bridgeState.tab === "dm")) refreshDm();
    else toast(session.user.role === "teacher" ? `📩 有 ${bridgeState.unread} 封學生來信` : "📩 老師寫信給你了！點右邊的「老師來信」看看", 4500);
  }
  document.querySelectorAll(".mail-badge").forEach(el => { el.textContent = bridgeState.unread; el.hidden = !bridgeState.unread; });
  if (session.user.role === "student" && p.unlock) {
    const st = paceState();
    if (p.unlock > (st.unlockSeen || 0) && p.unlock > (st.lastAt || 0)) {
      const wasLocked = st.lockUntil > Date.now();
      store(paceKey(), Object.assign(st, { count: 0, doubleLeft: 0, lockUntil: 0, unlockSeen: p.unlock }));
      if (wasLocked) toast("🔓 老師解除了扣押，可以繼續答題了！這次要慢慢看題目喔。", 5000);
    }
  }
}

  api("bridge", { op: "paceReport", reason: why, count }).catch(() => {});
}

function bridgeError(e) { return `<div class="empty-note">⚠️ ${escapeHtml(e.message)}${/未知的動作/.test(e.message) ? "<br>（雲端 Apps Script 還沒更新成新版，請先貼上新的程式碼並重新部署）" : ""}</div>`; }

async function refreshDm() {

async function sendDm() {

    const r = await bridgeCall("dmSend", session.user.role === "teacher" ? { to: bridgeState.peer, text } : { text });
    bridgeState.msgs = r.messages || bridgeState.msgs;
    const isT = session.user.role === "teacher";
    if (isT) { const t = bridgeState.threads.find(x => x.name === bridgeState.peer); if (t) { t.last = text; t.lastT = nowStr(); } else bridgeState.threads.push({ name: bridgeState.peer, last: text, lastT: nowStr(), unread: 0 }); }

  } catch (e) { el.value = text; toast("⚠️ " + e.message, 4500); }
}

// ── 亂答紀錄 ──
function paceHtml() {
  const rows = bridgeState.pace || [], today = nowStr().slice(0, 10);
  const per = {};
  rows.filter(r => String(r.t).slice(0, 10) === today).forEach(r => {
    const p = per[r.name] || (per[r.name] = { name: r.name, n: 0, max: 0, last: "", reason: "" });
    if (r.reason === "老師解除") { p.n = 0; p.max = 0; p.unlocked = r.t; return; }
    p.n++; p.max = Math.max(p.max, r.count); p.last = r.t; p.reason = r.reason;
  });
  const list = Object.keys(per).map(k => per[k]).filter(p => p.n).sort((a, b) => b.max - a.max);
  const locked = p => p.max >= 3 && Date.now() - new Date(String(p.last).replace(" ", "T")).getTime() < 15 * 60000;
  return `<div class="lore-box">學生<b>太快作答</b>（3 秒內）或<b>連續 5 題點同一個位置</b>就算亂答：第 1 次這題不加分、第 2 次之後 10 題答錯加倍扣分、第 3 次扣押 15 分鐘。按「解除」會把他今天的次數歸零。</div>
    <h3>今天（${today}）</h3>
    ${list.length ? `<div class="dash-table-wrap"><table><thead><tr><th>學生</th><th class="num">次數</th><th>最近原因</th><th>最後時間</th><th>狀態</th><th></th></tr></thead><tbody>
      ${list.map(p => `<tr><td><b>${escapeHtml(shortName(p.name))}</b></td><td class="num ${p.max >= 3 ? "warn-num" : ""}">${p.max}</td><td>${escapeHtml(p.reason)}</td><td>${escapeHtml(String(p.last).slice(11, 16))}</td>
        <td>${locked(p) ? "⛓️ 扣押中" : p.max >= 2 ? "⚠️ 加倍扣分中" : "⚠️ 警告"}</td>
        <td><button class="btn-primary" style="padding:4px 10px; font-size:.78rem" onclick="unlockStudent('${escapeHtml(p.name)}')">🔓 解除</button>
          <button class="btn-ghost" style="padding:4px 8px; font-size:.78rem" onclick="bridgeState.peer='${escapeHtml(p.name)}'; bridgeState.tab='dm'; renderBridge();">📩</button></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty-note">今天沒有人亂答 👍</div>`}
    <h3>全部紀錄（最近 100 筆）</h3>
    <div class="dash-table-wrap"><table><thead><tr><th>時間</th><th>學生</th><th>原因</th><th class="num">第幾次</th><th>處置</th></tr></thead><tbody>
      ${rows.slice(-100).reverse().map(r => `<tr><td>${escapeHtml(String(r.t).slice(5, 16))}</td><td>${escapeHtml(shortName(r.name))}</td><td>${escapeHtml(r.reason)}</td><td class="num">${r.count || ""}</td><td>${escapeHtml(r.act)}${r.by && r.by !== "系統" ? "（" + escapeHtml(shortName(r.by)) + "）" : ""}</td></tr>`).join("") || `<tr><td colspan="5">還沒有紀錄</td></tr>`}
    </tbody></table></div>`;
}
async function unlockStudent(name) {

// ── 分科錯題 ──
function mistakeCard(q, compact) {
  const subj = q.subject, total = Object.values(q.choices || {}).reduce((t, n) => t + n, 0) || 1;
  const unfixed = (q.students || []).filter(s => !s.fixed);
  const rate = q.n ? Math.round(q.wrong / q.n * 100) : 0;
  const opts = (q.opts && q.opts.length ? q.opts : Object.keys(q.choices || {}));
  return `<div class="mk-card">
    <div class="mk-head"><span>${escapeHtml(subj)}・${escapeHtml(splitUnit(q.unit)[1] || q.unit)}</span><b>錯 ${q.wrong} 次／作答 ${q.n} 次（${rate}%）</b></div>
    <div class="mk-q">${mathHtml(q.q, subj)}</div>
    ${compact ? "" : `<div class="mk-opts">${opts.map(o => {
      const t = stripNum(o), right = t === stripNum(q.correctText), n = (q.choices || {})[o] || (q.choices || {})[t] || 0;
      return `<div class="mk-opt ${right ? "right" : ""}"><span>${right ? "✅" : n ? "❌" : "・"} ${mathHtml(t, subj)}</span><i style="width:${right ? 0 : Math.round(n / total * 100)}%"></i><em>${right ? "正確答案" : n ? n + " 次" : ""}</em></div>`;
    }).join("")}</div>`}
    <div class="mk-who">${(q.students || []).map(s => `<span class="mk-st ${s.fixed ? "ok" : ""}">${s.fixed ? "✅" : "❌"} ${escapeHtml(shortName(s.name))}${s.wrong > 1 ? "×" + s.wrong : ""}</span>`).join("")}</div>
    ${compact ? "" : `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px">
      ${unfixed.length ? `<button class="btn-accent" style="padding:6px 12px; font-size:.82rem" onclick="remindUnfixed('${escapeHtml(q.qId)}')">📩 提醒 ${unfixed.length} 位還沒訂正的同學</button>` : `<span style="font-size:.82rem">🎉 答錯的同學都訂正好了</span>`}
      ${q.exp ? `<details style="font-size:.84rem"><summary>看詳解</summary>${mathHtml(q.exp, subj)}</details>` : ""}</div>`}

function mistakesHtml() {

      ${subjects.map(s => btn(bridgeState.subject === s, s === "全部" ? "全部科目" : s + `（${all.filter(q => q.subject === s).length}）`, `bridgeState.subject='${escapeHtml(s)}'; bridgeState.unit='全部'; document.getElementById('bridge-body').innerHTML=mistakesHtml();`)).join("")}
    </div>

      <select onchange="bridgeState.unit=this.value; document.getElementById('bridge-body').innerHTML=mistakesHtml();">${units.map(u => `<option ${u === bridgeState.unit ? "selected" : ""} value="${escapeHtml(u)}">${u === "全部" ? "全部單元" : escapeHtml(u)}</option>`).join("")}</select>
      排序：${btn(bridgeState.sort === "wrong", "答錯次數", "bridgeState.sort='wrong'; document.getElementById('bridge-body').innerHTML=mistakesHtml();")}
      ${btn(bridgeState.sort === "rate", "錯誤率", "bridgeState.sort='rate'; document.getElementById('bridge-body').innerHTML=mistakesHtml();")}
      ${btn(bridgeState.sort === "unfixed", "還沒訂正人數", "bridgeState.sort='unfixed'; document.getElementById('bridge-body').innerHTML=mistakesHtml();")}

    ${list.length ? list.map(q => mistakeCard(q)).join("") : `<div class="empty-note">這裡還沒有人答錯 👍</div>`}`;

// ── 示範模式的艦橋（全部記在這台裝置，換帳號登入就能測試老師和學生互傳） ──
function demoBridge(op, d) {
  const K = "508_DEMO_BRIDGE", db = load(K, { rules: null, dms: [], pace: [], unl: {} });
  const save = () => store(K, db);
  const me = session.user.role === "teacher" ? "老師" : session.user.name;
  const thread = peer => {
    db.dms.forEach(m => { if (m.to === me && m.from === peer) m.read = true; }); save();
    return { messages: db.dms.filter(m => (m.from === me && m.to === peer) || (m.from === peer && m.to === me)).map(m => ({ t: m.t, from: m.from, text: m.text, mine: m.from === me })) };
  };
  if (op === "pulse") return { unread: db.dms.filter(m => m.to === me && !m.read).length, unlock: db.unl[session.user.name] || 0, rules: db.rules || DEFAULT_RULES };
  if (op === "rules") return { rules: db.rules || DEFAULT_RULES };
  if (op === "setRules") { db.rules = Object.assign({}, DEFAULT_RULES, d.rules); save(); return { rules: db.rules }; }
  if (op === "dmSend") { db.dms.push({ t: nowStr(), from: me, to: me === "老師" ? d.to : "老師", text: d.text, read: false }); save(); return thread(me === "老師" ? d.to : "老師"); }
  if (op === "dmList") {
    if (me !== "老師") return thread("老師");
    if (d.with) return thread(d.with);
    const map = {};
    db.dms.forEach(m => { const p = m.from === "老師" ? m.to : m.from; const c = map[p] || (map[p] = { name: p, last: "", lastT: "", unread: 0 }); c.last = m.text; c.lastT = m.t; if (m.to === "老師" && !m.read) c.unread++; });
    return { threads: Object.values(map) };
  }
  if (op === "paceReport") {
    const act = d.count >= 3 ? "扣押 15 分鐘" : d.count === 2 ? "接下來 10 題答錯加倍扣分" : "這題不加分、答錯加倍扣分";
    db.pace.push({ t: nowStr(), name: d._from, reason: d.reason === "same" ? "連續點同一個位置" : "太快作答", count: d.count, act, by: "系統" }); save(); return {};
  }
  if (op === "paceList") return { rows: db.pace };
  if (op === "unlock") { db.pace.push({ t: nowStr(), name: d.to, reason: "老師解除", count: 0, act: "解除扣押並重新計算", by: session.user.name }); db.unl[d.to] = Date.now(); save(); return {}; }
  if (op === "mistakes") {
    const want = d.season !== "mid", byQ = {};
    studentsList().forEach(s => load("508_DEMO_DATA_" + s.name, { answers: [] }).answers
      .filter(r => (String(r.sid || "").indexOf(FINAL_SID) === 0) === want)
      .forEach(r => {
        const q = byQ[r.qId] || (byQ[r.qId] = { qId: r.qId, subject: r.subject, unit: r.unit, q: r.q, opts: r.opts, correctText: r.correctText, exp: r.exp, n: 0, wrong: 0, choices: {}, who: {} });
        q.n++; if (!r.ok) { q.wrong++; q.choices[r.chosen] = (q.choices[r.chosen] || 0) + 1; }
        const w = q.who[s.name] || (q.who[s.name] = { name: s.name, wrong: 0, fixed: false });
        if (!r.ok) w.wrong++; w.fixed = r.ok;
      }));
    return { mistakes: Object.values(byQ).filter(q => q.wrong).map(q => Object.assign(q, { students: Object.values(q.who).filter(w => w.wrong) })) };
  }
  throw new Error("未知的艦橋動作");
}

    if (challenger === session.user.name) {
      const ok = q => q && q.src !== "gen" && (!subject || q.subject === subject) && !q.passage && !q.diagram;
      const wrong = questionObjects(stats.wrongEver).filter(ok);
      const pend = wrong.filter(q => stats.pending.some(p => p.qId === q.id));
      const pool0 = pend.length ? pend : wrong;
      if (pool0.length) {
        const q = prepareQuestion(pickRandom(pool0));
        return { id: q.id, subject: q.subject, unit: q.unit, q: q.q, opts: q.opts.map(stripNum), ans: q.ans, exp: q.exp, fromMistake: true };
      }
    }
    let pool = BANK.filter(q => (!subject || q.subject === subject) && !q.passage);
    const v = VIRTUAL_UNITS.filter(x => x.subject === subject);
    if (v.length && (!pool.length || Math.random() < 0.4)) pool = [pickRandom(v).gen()];
    const q = prepareQuestion(pickRandom(pool.length ? pool : BANK.filter(x => !x.passage)));
    return { id: q.id, subject: q.subject, unit: q.unit, q: q.q, opts: q.opts.map(stripNum), ans: q.ans, exp: q.exp };
  }
  function botAnswerLater(b, bot) {
    setTimeout(() => { if (st.battle === b && b.status === "active") { b.ans[bot.name] = Math.random() < 0.65 ? b.q.ans : (b.q.ans + 1) % b.q.opts.length; if (b.ans[session.user.name] != null) resolve(b); } }, 2500 + Math.random() * 4000);
  }
  return {
    presence({ place, since }) {
      bots().forEach(bot => {
        if (!st.places[bot.name] || Math.random() < 0.2) st.places[bot.name] = Math.random() < 0.45 ? place : pickRandom(allPlaces());
      });
      if (!st.battle && session.user.role === "student" && battleOn() && Date.now() > st.nextBotChallenge) {
        const bot = bots().find(b => st.places[b.name] === place);
        if (bot) {
          st.battle = { id: uid(), a: bot.name, b: session.user.name, status: "pending", until: Date.now() + 20000, ans: {}, subject: view.subject };
          st.nextBotChallenge = Date.now() + 90000;
        }
      }
      return snapshot(since);
    },
    chat({ text, since }) {
      st.msgs.push({ id: Date.now(), name: session.user.name, emoji: myEmoji(), color: myColor(), role: session.user.role, text, t: nowStr() });
      const bot = pickRandom(bots());
      if (bot) setTimeout(() => botSay(bot, text.includes("@" + shortName(bot.name)) ? "嗨嗨！👋" : pickRandom(LINES)), 1800);
      return snapshot(since);
    },
    battle({ op, to, id, accept, choice, since, subject }) {
      const me = session.user.name;
      if (op === "challenge") {
        const bot = bots().find(b => b.name === to);
        if (!bot) throw new Error("找不到這位同學");
        if (session.user.role === "parent" && to !== session.user.child) throw new Error("家長只能和自己的孩子對戰");
        if (session.user.role === "student" && bot.battleOn === false) throw new Error("這位同學關閉了挑戰，正在專心練習");
        const b = st.battle = { id: uid(), a: me, b: to, status: "pending", until: Date.now() + 20000, ans: {}, subject: subject || "", ar: session.user.role, ae: myEmoji(), ac: myColor() };
        setTimeout(() => {
          if (st.battle !== b || b.status !== "pending") return;
          if (Math.random() < 0.9) { b.status = "active"; b.q = pickQuestion(subject, me); b.until = Date.now() + 25000; botAnswerLater(b, bot); }
          else b.status = "declined";
        }, 1500);
      } else if (op === "respond" && st.battle && st.battle.id === id) {
        const b = st.battle;
        if (accept) { b.status = "active"; b.q = pickQuestion(b.subject, b.a); b.until = Date.now() + 25000; botAnswerLater(b, BOTS.find(x => x.name === b.a)); }
        else b.status = "declined";
      } else if (op === "answer" && st.battle && st.battle.id === id && st.battle.status === "active") {
        const b = st.battle;
        if (b.ans[me] == null) b.ans[me] = choice;
        const opp = b.a === me ? b.b : b.a;
        if (b.ans[opp] != null) resolve(b);
      } else if (op === "cancel" && st.battle && st.battle.id === id) {
        st.battle = null;
      } else if (op === "ack" && st.battle && st.battle.id === id) {
        st.battle = null;
      }
      return snapshot(since);
    },
    saveProfile(p) { store("508_DEMO_PROFILE_" + session.user.name, p); return { ok: true }; },
    getProfile() { return { profile: load("508_DEMO_PROFILE_" + session.user.name, null) }; }
  };
})();

function hashStr(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) | 0; return (h >>> 0).toString(36); }
function genQ(subject, unit, type, q, correct, wrongs, exp) {
  const opts = [correct, ...wrongs].map(String);
  return { id: "g-" + hashStr(unit + q + correct), subject, unit, type, q, opts, ans: 0, exp, src: "gen" };
}
function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pickN(arr, n) { return shuffle(arr).slice(0, n); }
function uniqWrongs(correct, cands, n) {
  const out = [];
  for (const c of shuffle(cands)) { if (String(c) !== String(correct) && !out.map(String).includes(String(c))) out.push(c); if (out.length >= n) break; }
  return out;
}

  return genQ("數學", M5, "對稱觀念", q, a, w, e);
}

// ── 英語 ──
const DRINKS = [["water", "水"], ["tea", "茶"], ["coffee", "咖啡"], ["milk", "牛奶"], ["juice", "果汁"], ["cola", "可樂"], ["soy milk", "豆漿"], ["bubble tea", "珍珠奶茶"], ["hot chocolate", "熱巧克力"], ["lemonade", "檸檬水"], ["milk tea", "奶茶"]];
const FRUITS = [["apples", "蘋果"], ["bananas", "香蕉"], ["grapes", "葡萄"], ["guavas", "芭樂"], ["oranges", "柳橙"], ["papayas", "木瓜"], ["pineapples", "鳳梨"]];
const ONES = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"], TENS = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
const TEENS = ["ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
function numWord(n) { if (n === 100) return "one hundred"; if (n < 10) return ONES[n]; if (n < 20) return TEENS[n - 10]; return TENS[Math.floor(n / 10)] + (n % 10 ? "-" + ONES[n % 10] : ""); }
const SUBJ3 = ["He", "She", "Amy", "Kevin", "My brother", "Mom"], SUBJP = ["I", "You", "We", "They", "Amy and Kevin", "My parents"];
const EU1 = "Unit 1 The Best Drink", EU2 = "Unit 2 Let's Make Fruit Salad";

function genVocab(unit, list) {
  const [en, zh] = pickRandom(list), others = list.filter(x => x[0] !== en);
  if (Math.random() < 0.5) return genQ("英語", unit, "單字", `「${en}」的中文意思是什麼？`, zh, pickN(others, 3).map(x => x[1]), `${en}：${zh}`);
  return genQ("英語", unit, "單字", `「${zh}」的英文是哪一個？`, en, pickN(others, 3).map(x => x[0]), `${zh}：${en}`);
}
function genEnglish1() {
  const r = Math.random();
  if (r < 0.35) return genVocab(EU1, DRINKS);
  if (r < 0.55) {
    const n = Math.random() < 0.2 ? 100 : randInt(20, 99);
    const near = [n + 10, n - 10, n + 1, n - 1, (n % 10) * 10 + Math.floor(n / 10)].filter(v => v >= 13 && v <= 100 && v !== n);
    if (Math.random() < 0.5) return genQ("英語", EU1, "數字", `「${numWord(n)}」是哪一個數字？`, n, uniqWrongs(n, near, 3), `${numWord(n)} = ${n}`);
    return genQ("英語", EU1, "數字", `${n} 的英文怎麼寫？`, numWord(n), uniqWrongs(numWord(n), near.map(numWord), 3), `${n} = ${numWord(n)}`);
  }
  const [d] = pickRandom(DRINKS);
  if (r < 0.78) {
    const third = Math.random() < 0.5, s = pickRandom(third ? SUBJ3 : SUBJP);
    return genQ("英語", EU1, "句型 like / likes", `${s} ＿＿＿ ${d}.`, third ? "likes" : "like", third ? ["like", "liking", "is like"] : ["likes", "liking", "is like"],
      third ? `${s} 是第三人稱單數，動詞要加 s：${s} likes ${d}.` : `${s} 不是第三人稱單數，用原形：${s} like ${d}.`);
  }
  const third = Math.random() < 0.5, s = pickRandom(third ? SUBJ3.filter(x => !["He", "She"].includes(x)) : ["you", "they"]);
  const pron = third ? (["Amy", "Mom"].includes(s) ? "she" : "he") : (s === "you" ? "I" : "they");
  const yes = Math.random() < 0.5;
  const ansText = yes ? `Yes, ${pron} ${third ? "does" : "do"}.` : `No, ${pron} ${third ? "doesn’t" : "don’t"}.`;
  const wrongs = yes ? [`Yes, ${pron} ${third ? "do" : "does"}.`, `Yes, ${pron} is.`, `No, ${pron} ${third ? "doesn’t" : "don’t"}.`] : [`No, ${pron} ${third ? "don’t" : "doesn’t"}.`, `No, ${pron} isn’t.`, `Yes, ${pron} ${third ? "does" : "do"}.`];
  return genQ("英語", EU1, "句型 Do / Does", `A: ${third ? "Does" : "Do"} ${s} like ${d}?\nB: ${yes ? "（喜歡）" : "（不喜歡）"} ＿＿＿＿`, ansText, wrongs,
    `${third ? "Does" : "Do"} 開頭的問句，回答也用 ${third ? "does / doesn’t" : "do / don’t"}：${ansText}`);
}
function genEnglish2() {
  const r = Math.random();
  if (r < 0.4) return genVocab(EU2, FRUITS);
  const [f] = pickRandom(FRUITS), single = f.replace(/s$/, "");
  if (r < 0.65) {
    const third = Math.random() < 0.5, s = pickRandom(third ? SUBJ3 : SUBJP), n = randInt(2, 9);
    return genQ("英語", EU2, "句型 need / needs", `${s} ＿＿＿ ${numWord(n)} ${f}.`, third ? "needs" : "need", third ? ["need", "needing", "is need"] : ["needs", "needing", "is need"],
      third ? `${s} 是第三人稱單數，用 needs。` : `${s} 用 need。`);
  }
  if (r < 0.85) {
    const n = randInt(2, 9), art = /^[aeiou]/.test(single) ? "an" : "a";
    return genQ("英語", EU2, "單複數", "下列哪一句是正確的？", `I need ${numWord(n)} ${f}.`,
      [`I need ${numWord(n)} ${single}.`, `I need ${art} ${f}.`, `She need ${numWord(n)} ${f}.`],
      `兩個以上要用複數 ${f}；一個用 ${art} ${single}；主詞 She 要用 needs。`);
  }
  return genQ("英語", EU2, "句型 How many", `A: ＿＿＿ ${f} do you need?\nB: I need four ${f}.`, "How many", ["How much", "What", "Where"], "問「幾個」要用 How many，後面接複數名詞。");
}

  { subject: "數學", unit: M5, gen: genSymmetry, only: true, icon: "🦋", lore: "<b>【線對稱島】</b>對稱軸、對稱點、對稱邊、對稱角。" },
  { subject: "英語", unit: EU1, gen: genEnglish1, only: false, icon: "🧋" },
  { subject: "英語", unit: EU2, gen: genEnglish2, only: false, icon: "🍍" }
];
function virtualOf(unit) { return VIRTUAL_UNITS.find(v => v.subject === unit.subject && v.unit === unit.unit); }
function generateVirtual(v, n, used) {
  const out = [], ids = new Set(used);
  for (let i = 0; i < n * 15 && out.length < n; i++) {
    const q = v.gen();
    if (q && !ids.has(q.id) && new Set(q.opts).size === q.opts.length) { ids.add(q.id); out.push(q); }
  }
  return out;
}
