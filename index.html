    return;
  }
  const hasGen = !!unit.virtual || (unit.subject === "國語" && (CHAR_FACTS.some(f => f.unit === unit.unit) || /字音|字形|部首/.test(unit.unit)));
  const genOnly = unit.virtual && unit.virtual.only;
  const pend = pendingCount(q => unitKey(q.subject, q.unit) === key);
  document.getElementById("quiz-content").innerHTML = `
    <h2 style="margin-top:0;">${unit.icon} ${escapeHtml(unit.subject)}｜${escapeHtml(unit.unit)}</h2>
    ${unit.lore ? `<div class="lore-box">${unit.lore}</div>` : ""}
    <div class="lore-box violet">
      🎲 <b>每次登島隨機抽 ${SESSION_SIZE} 題，每次都不一樣：</b><br>
      ${genOnly ? `• 這座島的題目每次都由程式重新產生，數字、句子、選項都會換<br>• 以前在這裡答錯的題目，也會挑一兩題回來複習<br>`
        : `• 本單元題庫 ${unit.questions.length} 題，做過次數少的優先出現<br>
      • ${hasGen ? "加上程式隨機生成的題目，" : ""}不夠 ${SESSION_SIZE} 題時從橋連著的單元抽「跨單元複習」<br>`}
      • 選項順序每次重新洗牌${pend ? `<br>• 這個單元還有 <b style="color:var(--danger)">${pend}</b> 題錯題待訂正` : ""}
    </div>
    ${isTrial() ? `<div class="trial-note">👀 試玩模式：這次作答不會列入紀錄</div>` : ""}
    <button class="btn-primary" style="width:100%; padding:14px; font-size:1.05rem; margin-top:10px;" data-key="${escapeHtml(key)}" onclick="startQuiz(this.dataset.key)">⚔️ 開始闖關</button>`;
  openModal("quiz-modal");
}

function newQuizState(mode, subject, unit, questions) {
  return { mode, subject, unit, questions, idx: 0, correctCount: 0, combo: 0, maxCombo: 0, startTime: Date.now(), sid: uid(), pts: 0 };
}

function startQuiz(key) {
  const unit = WORLD.flatMap(s => s.units).find(u => u.key === key);
  quizState = newQuizState("練習", unit.subject, unit.unit, buildSession(unit));
  renderQuestion();
}

function sourceBadge(q) {
  if (q.crossFrom) return `<span class="src-badge">🔁 跨單元複習・${escapeHtml(q.crossFrom)}</span>`;
  if (q.src === "gen") return `<span class="src-badge">🎲 隨機生成</span>`;
  return "";
}

function renderQuestion() {
  const q = quizState.questions[quizState.idx];
  const total = quizState.questions.length;
  document.getElementById("quiz-content").innerHTML = `
    <div class="q-head">
      <span>📍 ${escapeHtml(q.subject)}・${escapeHtml(q.unit)}｜【${escapeHtml(q.type)}】${q.diagram && SVG_DIAGRAMS[q.diagram] ? "📊 含圖解" : ""}${sourceBadge(q)}</span>
      <span>🔥 連擊 x${quizState.combo}｜第 ${quizState.idx + 1} / ${total} 題</span>
    </div>
    <div class="bar"><i style="width:${Math.round(quizState.idx / total * 100)}%"></i></div>
    ${quizState.mode === "訂正" ? `<div class="trial-note" style="background:#fee2e2;color:#991b1b">👾 錯題訂正中：答對就能把這題從待訂正消滅（歷史紀錄會留著）</div>` : ""}
    ${quizState.mode === "複習" ? `<div class="trial-note" style="background:#e0e7ff;color:#3730a3">📚 歷史錯題複習：答對 +${SCORE_RULES.reviewOk}，又錯 ${SCORE_RULES.reviewWrong} 並回到待訂正</div>` : ""}
    ${q.passage ? `<details class="passage" ${quizState.lastPassage === q.passage ? "" : "open"}><summary>📖 課文（點一下收合／展開）</summary><div>${escapeHtml(q.passage)}</div></details>` : ""}
    <h3 style="margin:16px 0 10px; line-height:1.6; white-space:pre-line;">Q${quizState.idx + 1}. ${escapeHtml(q.q)}</h3>
    <div id="opts-box">${q.opts.map((o, i) => `<button class="option-btn" onclick="submitAnswer(${i})">${escapeHtml(o)}</button>`).join("")}</div>
    <div id="feedback-box" style="margin-top:12px;"></div>`;
}

function submitAnswer(choice) {
  const q = quizState.questions[quizState.idx];
  quizState.lastPassage = q.passage || "";
  const btns = document.querySelectorAll("#opts-box .option-btn");
  btns.forEach(b => (b.disabled = true));
  const ok = choice === q.ans;
  if (ok) { quizState.correctCount++; quizState.combo++; quizState.maxCombo = Math.max(quizState.maxCombo, quizState.combo); }
  else quizState.combo = 0;
  const pts = answerPoints(q, ok, quizState.mode, quizState.combo);
  const wasRepeat = !ok && quizState.mode !== "訂正" && pts === SCORE_RULES.wrongAgain;
  quizState.pts += pts;
  const lvBefore = getLevelInfo(stats.score).lv;

  saveRecord({
    t: nowStr(), subject: q.subject, unit: q.unit, qId: q.id, q: q.q, opts: q.opts.map(stripNum),
    chosen: stripNum(q.opts[choice]), correctText: stripNum(q.opts[q.ans]), ok, mode: quizState.mode,
    exp: q.exp || "", sid: quizState.sid, uid: uid(), pts
  });
  const lvAfter = getLevelInfo(stats.score).lv;
  const lvNote = isTrial() || lvAfter === lvBefore ? "" : lvAfter > lvBefore
    ? `<div class="lv-note up">🎉 升級了！現在是 Lv.${lvAfter} ${getLevelInfo(stats.score).title}</div>`
    : `<div class="lv-note down">⚠️ 降級了…現在是 Lv.${lvAfter}，把錯題訂正好就能升回來！</div>`;
  const ptsNote = isTrial() ? "" : `<span class="pts ${pts >= 0 ? "plus" : "minus"}">${fmtPts(pts)} 分</span>${wasRepeat ? `<span style="font-size:.8rem;">（這題以前錯過，一錯再錯扣更多）</span>` : ""}`;

  btns[q.ans].classList.add("correct");
  btns[q.ans].insertAdjacentText("beforeend", " ⬅ 正確答案");
  if (!ok) { btns[choice].classList.add("wrong"); btns[choice].insertAdjacentText("beforeend", " ⬅ 你的選擇"); }
  const last = quizState.idx + 1 >= quizState.questions.length;
  document.getElementById("feedback-box").innerHTML = `
    <div class="lore-box" style="border-left-color:${ok ? "#16a34a" : "#dc2626"}; background:${ok ? "rgba(22,163,74,0.1)" : "rgba(220,38,38,0.1)"}">
      <div style="font-weight:900; color:${ok ? "#15803d" : "#b91c1c"};">${ptsNote} ${ok ? (quizState.mode === "訂正" ? "🎉 訂正成功！這題已從錯題本消滅" : "🎉 答對了！觀念很清楚！") : `💡 答錯囉！正確答案是【${escapeHtml(stripNum(q.opts[q.ans]))}】${isTrial() ? "" : "（已加入錯題本）"}`}</div>
      ${q.exp ? `<div style="margin-top:6px;">📝 <b>詳解：</b>${escapeHtml(q.exp)}</div>` : ""}
    </div>
    ${lvNote}
    ${q.diagram && SVG_DIAGRAMS[q.diagram] ? SVG_DIAGRAMS[q.diagram] : ""}
    <button class="btn-primary" style="width:100%; padding:12px; margin-top:6px;" onclick="nextQuestion()">${last ? "🏁 看本局成績" : "➡️ 看懂了，下一題"}</button>`;
  renderPills();
}

function nextQuestion() {
  if (quizState.mode === "練習" && !isTrial() && stats.pending.length >= LOCK_LIMIT) {
    finishQuiz(true);
    return;
  }
  quizState.idx++;
  if (quizState.idx < quizState.questions.length) renderQuestion();
  else finishQuiz(false);
}

function finishQuiz(lockedOut) {
  const done = lockedOut ? quizState.idx + 1 : quizState.questions.length;
  const sec = Math.max(5, Math.round((Date.now() - quizState.startTime) / 1000));
  const acc = done ? quizState.correctCount / done : 0;
  const bonus = sessionBonus(quizState.correctCount, done);
  const score = bonus;
  saveRecord(null, {
    t: nowStr(), subject: quizState.subject, unit: quizState.mode === "練習" ? quizState.unit : quizState.mode === "訂正" ? "錯題本" : "歷史錯題複習",
    total: done, correct: quizState.correctCount, score, sid: quizState.sid
  });
  const lv = getLevelInfo(stats.score);
  const stars = acc === 1 ? 3 : acc >= 0.7 ? 2 : acc >= 0.4 ? 1 : 0;
  document.getElementById("quiz-content").innerHTML = `
    <div style="text-align:center;">
      <div style="font-size:3.2rem;">${lockedOut ? "⚠️" : "🏆"}</div>
      <h2>${lockedOut ? "錯題已滿 10 題，先去訂正！" : quizState.mode === "訂正" ? "錯題訂正完成！" : quizState.mode === "複習" ? "歷史錯題複習完成！" : "單元闖關完成！"}</h2>
      ${quizState.mode === "練習" && !lockedOut ? `<div style="font-size:2rem; letter-spacing:4px;">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>` : ""}
      <div class="lore-box" style="text-align:left;">
        • 答對 <b>${quizState.correctCount} / ${done}</b> 題（正確率 ${Math.round(acc * 100)}%）<br>
        • 作答 <b>${sec}</b> 秒・最高連擊 <b>x${quizState.maxCombo}</b><br>
        • 每題加減分合計 <b>${fmtPts(quizState.pts)}</b>，結算${bonus > 0 ? "獎勵" : bonus < 0 ? "扣分" : ""} <b>${fmtPts(bonus)}</b><br>
        • 本局共 <b style="color:${quizState.pts + bonus >= 0 ? "var(--accent)" : "var(--danger)"}; font-size:1.15rem;">${fmtPts(quizState.pts + bonus)} 分</b>${isTrial() ? "（試玩不列入紀錄）" : ""}
      </div>
      ${isTrial() ? "" : `<div style="background:linear-gradient(135deg,#1e3a8a,#3b82f6); color:#fff; padding:16px; border-radius:16px; margin:12px 0;">
        <div style="font-size:.85rem; opacity:.9;">目前等級</div><div style="font-size:1.6rem; font-weight:900;">⭐ Lv.${lv.lv}｜${lv.title}</div>
        <div style="font-size:.85rem;">累計 ${stats.score} 分</div></div>`}
      <button class="btn-primary" style="width:100%; padding:12px;" onclick="${lockedOut ? "openMistakeBook('pending')" : "closeQuiz()"}">${lockedOut ? "🌋 前往錯題島" : "🗺️ 回到地圖"}</button>
    </div>`;
}

function closeQuiz() {
  closeModal("quiz-modal");
  renderAll();
}

// 9. 錯題島：待訂正（清完才能繼續冒險）＋ 歷史錯題（訂正過也會留著，隨時可以再複習）

function questionObjects(list) {
  return list.map(p => {
    const q = findQuestion(p.qId);
    if (q) return q;
    const ans = (p.opts || []).indexOf(p.correctText);
    return ans >= 0 ? { id: p.qId, subject: p.subject, unit: p.unit, type: "錯題", q: p.q, opts: p.opts, ans, exp: p.exp, src: "snap" } : null;
  }).filter(Boolean);
}
function pendingQuestionObjects() { return questionObjects(stats.pending); }

let mistakeView = { tab: "pending", subject: "全部" };

function openMistakeBook(tab) {
  if (tab) mistakeView.tab = tab;
  const box = document.getElementById("quiz-content");
  openModal("quiz-modal");
  if (isTrial()) {
    box.innerHTML = `<h2 style="margin-top:0;">🌋 錯題島</h2><div class="lore-box">錯題本是每位學生自己的。老師和家長請到「📊 後台」查看孩子哪些題目答錯、訂正了幾次、哪些一錯再錯。</div>
      <button class="btn-accent" onclick="closeModal('quiz-modal'); openDashboard();">📊 開啟後台</button>`;
    return;
  }
  const tabs = `<div class="tabs">
    <button class="${mistakeView.tab === "pending" ? "on" : ""}" onclick="openMistakeBook('pending')">👾 待訂正（${stats.pending.length}）</button>
    <button class="${mistakeView.tab === "history" ? "on" : ""}" onclick="openMistakeBook('history')">📚 歷史錯題（${stats.wrongEver.length}）</button></div>`;

  if (mistakeView.tab === "history") {
    const subjects = ["全部", ...new Set(stats.wrongEver.map(q => q.subject))];
    const list = stats.wrongEver.filter(q => mistakeView.subject === "全部" || q.subject === mistakeView.subject)
      .sort((a, b) => b.wrong - a.wrong || (a.lastTime < b.lastTime ? 1 : -1));
    box.innerHTML = `
      <h2 style="margin-top:0;">🌋 錯題島｜歷史錯題</h2>${tabs}
      <p style="font-size:.86rem; margin:0 0 8px;">訂正過的題目也會一直留在這裡。錯過的題目以後還可能再錯，隨時回來複習一下！</p>
      <div class="tabs" style="margin-top:0">${subjects.map(s => `<button class="${s === mistakeView.subject ? "on" : ""}" onclick="mistakeView.subject='${escapeHtml(s)}'; openMistakeBook();">${escapeHtml(s)}</button>`).join("")}</div>
      ${list.length ? `<div style="max-height:360px; overflow-y:auto; padding-right:6px;">${list.map(q => `
        <div class="q-row">
          <div class="meta">${q.last === false ? `<span class="chip red">待訂正</span>` : `<span class="chip green">已訂正</span>`}
            <span class="chip ${q.wrong >= 2 ? "red" : "amber"}">錯 ${q.wrong} 次</span><span>${escapeHtml(q.subject)}・${escapeHtml(q.unit)}</span></div>
          <div>${escapeHtml(q.q)}</div>
          <div style="color:var(--success); font-weight:800;">✔ ${escapeHtml(q.correctText)}</div>
        </div>`).join("")}</div>
        <button class="btn-primary" style="width:100%; padding:14px; margin-top:10px;" onclick="startReview()">🔁 複習${mistakeView.subject === "全部" ? "全部" : mistakeView.subject}錯題（隨機 ${Math.min(SESSION_SIZE, list.length)} 題，錯最多次的優先）</button>`
        : `<div class="empty-note">這一科還沒有錯過的題目，太厲害了！</div>`}`;
    return;
  }

  const list = pendingQuestionObjects();
  if (!list.length) {
    box.innerHTML = `<h2 style="margin-top:0;">🌋 錯題島</h2>${tabs}<div style="text-align:center; padding:16px;"><div style="font-size:3.2rem;">✨</div><h3>待訂正的錯題都清光了！</h3><p>所有單元都解鎖了。想再加強的話，可以到「📚 歷史錯題」複習以前錯過的題目。</p><button class="btn-primary" onclick="closeQuiz()">回地圖</button></div>`;
    return;
  }
  box.innerHTML = `
    <h2 style="margin-top:0; color:var(--danger);">🌋 錯題島｜待訂正 ${list.length} 題</h2>${tabs}
    <p style="font-size:.88rem;">先看懂正確答案和詳解，再按下面的按鈕重考，答對就能消滅它（紀錄還是會留在歷史錯題）：</p>
    <div style="max-height:360px; overflow-y:auto; padding-right:6px;">
      ${list.map((q, i) => {
        const st = stats.byId[q.id] || {};
        return `<div class="lore-box">
          <b>錯題 ${i + 1}【${escapeHtml(q.subject)}・${escapeHtml(q.unit)}】</b>${st.wrong >= 2 ? ` <span class="chip red">已經錯 ${st.wrong} 次</span>` : ""}<br>
          <span style="white-space:pre-line">${escapeHtml(q.q)}</span><br>
          <span style="color:var(--success); font-weight:900;">✔ 正確答案：${escapeHtml(stripNum(q.opts[q.ans]))}</span><br>
          ${q.exp ? `<span style="font-size:.86rem;">💡 ${escapeHtml(q.exp)}</span>` : ""}
          ${q.diagram && SVG_DIAGRAMS[q.diagram] ? SVG_DIAGRAMS[q.diagram] : ""}
        </div>`;
      }).join("")}
    </div>
    <button class="btn-danger" style="width:100%; padding:14px; font-size:1.05rem; margin-top:10px;" onclick="startMistakeRetry()">⚔️ 看懂了！開始錯題重考${list.length > SESSION_SIZE ? `（這輪 ${SESSION_SIZE} 題）` : ""}</button>`;
}

function startMistakeRetry() {
  const list = shuffle(pendingQuestionObjects()).slice(0, SESSION_SIZE).map(q => prepareQuestion(q));
  quizState = newQuizState("訂正", "錯題本", "錯題本", list);
  renderQuestion();
}

function startReview() {
  const pool = stats.wrongEver.filter(q => mistakeView.subject === "全部" || q.subject === mistakeView.subject)
    .sort((a, b) => b.wrong - a.wrong).slice(0, SESSION_SIZE * 2);
  const list = shuffle(questionObjects(shuffle(pool).sort((a, b) => b.wrong - a.wrong).slice(0, SESSION_SIZE))).map(q => prepareQuestion(q));
  if (!list.length) return;
  quizState = newQuizState("複習", "錯題本", "歷史錯題複習", list);
  renderQuestion();
}

let dashState = { data: null, student: null, tab: "repeated" };

async function openDashboard(student) {
  const box = document.getElementById("dash-content");
  openModal("dash-modal");
  if (!dashState.data || student !== undefined) box.innerHTML = `<div class="spinner"></div><div class="empty-note">正在讀取紀錄…</div>`;
  try {
    dashState.data = DEMO ? demoDashboard(student) : await api("dashboard", { student: student || dashState.student || "" });
    dashState.student = dashState.data.detail ? dashState.data.detail.name : null;
    renderDashboard();
  } catch (e) {
    box.innerHTML = `<div class="empty-note">⚠️ ${escapeHtml(e.message)}</div>`;
  }
}

function demoDashboard(student) {
  const students = rosterList.filter(a => a.role === "student");
  const statsOf = name => { const d = load("508_DEMO_DATA_" + name, { answers: [], sessions: [] }); return aggregate(d.answers, d.sessions); };
  const u = session.user;
  if (u.role === "parent") {
    const kid = students.find(s => s.name === u.child);
    return { scope: "parent", detail: { name: kid.name, seat: kid.seat, stats: statsOf(kid.name) } };
  }
  const pick = students.find(s => s.name === (student || dashState.student)) || students[0];
  return {
    scope: "teacher",
    summary: students.map(s => { const st = statsOf(s.name); return { seat: s.seat, name: s.name, attempts: st.attempts, correct: st.correct, score: st.score, pending: st.pending.length, repeated: st.repeated.length, lastActive: st.lastActive }; }),
    detail: { name: pick.name, seat: pick.seat, stats: statsOf(pick.name) }
  };
}

function renderDashboard() {
  const d = dashState.data;
  const box = document.getElementById("dash-content");
  let html = "";
  if (d.scope === "teacher") {
    html += `<h2 style="margin-top:0;">🧑‍🏫 508 全班後台 <button class="btn-ghost" style="font-size:.8rem; vertical-align:middle" onclick="showChatLog()">💬 全班聊天紀錄</button></h2>
      <p style="font-size:.84rem; color:var(--ink-soft); margin-top:0;">點任一位學生，看他答對、答錯哪些題目，訂正幾次，哪些一錯再錯。</p>
      <div class="dash-table-wrap"><table>
        <thead><tr><th>座號</th><th>姓名</th><th class="num">作答題次</th><th class="num">正確率</th><th class="num">待訂正</th><th class="num">一錯再錯</th><th class="num">積分</th><th>最後作答</th><th></th></tr></thead>
        <tbody>${d.summary.map(s => {
          const acc = s.attempts ? Math.round(s.correct / s.attempts * 100) : 0;
          return `<tr class="${s.name === dashState.student ? "sel" : ""}">
            <td>${escapeHtml(s.seat)}</td><td><b>${escapeHtml(shortName(s.name))}</b></td>
            <td class="num">${s.attempts}</td><td class="num">${s.attempts ? acc + "%" : "—"}</td>

            <td>${escapeHtml(s.lastActive || "—")}</td>

        }).join("")}</tbody></table></div>`;
  } else {
    html += `<h2 style="margin-top:0;">👨‍👩‍👧 孩子的學習紀錄</h2><p style="font-size:.84rem; color:var(--ink-soft); margin-top:0;">家長只能看到自己孩子的資料。</p>`;
  }
  html += d.detail ? detailHtml(d.detail) : `<div class="empty-note">沒有學生資料</div>`;
  box.innerHTML = html;
}

async function showChatLog() {

const DASH_TABS = [
  ["repeated", "🔁 一錯再錯"], ["pending", "👾 還沒訂正"], ["wrongEver", "❌ 答錯過的題目"], ["right", "✅ 答對的題目"], ["units", "📚 各科單元"]
];

function detailHtml(det) {
  const st = det.stats;
  const acc = st.attempts ? Math.round(st.correct / st.attempts * 100) : 0;
  const fixTries = st.questions.reduce((t, q) => t + q.fixTries, 0), fixes = st.questions.reduce((t, q) => t + q.fixes, 0);
  const lists = {
    repeated: st.repeated.slice().sort((a, b) => b.wrong - a.wrong),
    pending: st.pending,
    wrongEver: st.questions.filter(q => q.wrong > 0).sort((a, b) => b.wrong - a.wrong),
    right: st.questions.filter(q => q.correct > 0 && q.last === true)
  };
  const tab = dashState.tab;
  let body;
  if (tab === "units") {
    body = st.units.length ? st.units.map(u => {
      const p = Math.round(u.correct / u.total * 100);
      return `<div class="subj-row"><div><span>${escapeHtml(u.subject)}・${escapeHtml(u.unit)}</span><span>${p}%（${u.correct}/${u.total}）</span></div><div class="bar"><i style="width:${p}%; background:${p < 65 ? "#dc2626" : ""}"></i></div></div>`;
    }).join("") : `<div class="empty-note">還沒有作答紀錄</div>`;
  } else {
    const list = lists[tab];
    body = list.length ? list.map(qRowHtml).join("") : `<div class="empty-note">${tab === "repeated" ? "太棒了，沒有一錯再錯的題目！" : tab === "pending" ? "錯題都訂正完了！" : "還沒有資料"}</div>`;
  }
  return `
    <h3 style="margin:18px 0 4px;">📌 ${escapeHtml(det.seat)} 號 ${escapeHtml(shortName(det.name))}</h3>
    <div class="kpis">
      <div class="tile-kpi"><b>${st.attempts}</b><span>作答題次</span></div>
      <div class="tile-kpi"><b>${st.attempts ? acc + "%" : "—"}</b><span>正確率</span></div>
      <div class="tile-kpi"><b style="color:var(--danger)">${st.pending.length}</b><span>還沒訂正</span></div>
      <div class="tile-kpi"><b style="color:var(--danger)">${st.repeated.length}</b><span>一錯再錯的題目</span></div>
      <div class="tile-kpi"><b>${fixTries}</b><span>訂正次數（成功 ${fixes}）</span></div>
      <div class="tile-kpi"><b>${escapeHtml(st.lastActive || "—")}</b><span>最後作答</span></div>
    </div>
    <div class="tabs">${DASH_TABS.map(([k, label]) => `<button class="${k === tab ? "on" : ""}" onclick="dashState.tab='${k}'; renderDashboard();">${label}${k !== "units" ? `（${lists[k].length}）` : ""}</button>`).join("")}</div>
    <div>${body}</div>`;
}

function qRowHtml(q) {
  const status = q.last === false ? `<span class="chip red">待訂正</span>` : q.wrong ? `<span class="chip green">已訂正</span>` : `<span class="chip green">全對</span>`;
  return `<div class="q-row">
    <div class="meta">${status}${q.wrong >= 2 ? `<span class="chip red">錯 ${q.wrong} 次</span>` : ""}
      <span>${escapeHtml(q.subject)}・${escapeHtml(q.unit)}</span>
      <span>作答 ${q.attempts} 次・對 ${q.correct}・錯 ${q.wrong}・訂正 ${q.fixTries} 次${q.fixTries ? `（成功 ${q.fixes}）` : ""}</span></div>
    <div>${escapeHtml(q.q)}</div>
    <div style="color:var(--success); font-weight:800;">✔ 正確答案：${escapeHtml(q.correctText)}</div>
    ${q.wrongAnswers.length ? `<div style="color:var(--danger); font-size:.82rem;">✘ 曾經選過：${q.wrongAnswers.map(escapeHtml).join("、")}</div>` : ""}
  </div>`;
}

const CHAT_QUICK = ["👋 嗨！", "要不要來比賽？⚔️", "我拿三顆星了！⭐", "錯題島見！🌋", "加油！💪", "好難喔 😵"];

const net = {
  others: [], messages: [], battle: null, timer: null, sig: "",
  start() {
    this.stop();
    this.others = []; this.messages = []; this.battle = null; this.sig = "";
    this.heartbeat();
    this.timer = setInterval(() => { if (!document.hidden) this.heartbeat(); }, 4000);
  },
  stop() { clearInterval(this.timer); this.timer = null; },
  async call(action, data) { return DEMO ? demo[action](data) : api(action, data); },
  async heartbeat() {
    if (!session) return;
    try {
      const since = this.messages.length ? this.messages[this.messages.length - 1].id : 0;
      this.apply(await this.call("presence", { place: myPlace(), since, emoji: myEmoji(), color: myColor() }));
    } catch (e) { /* 網路斷掉時下次再試 */ }
  },
  apply(r) {
    if (!r) return;
    this.others = (r.others || []).filter(o => o.name !== session.user.name);
    const known = new Set(this.messages.map(m => m.id));
    (r.messages || []).forEach(m => { if (!known.has(m.id)) this.messages.push(m); });
    this.messages = this.messages.slice(-40);
    this.battle = r.battle || null;
    const sig = this.others.map(o => o.name + o.place + o.emoji).join("|");
    if (sig !== this.sig) { this.sig = sig; renderSide(); }
    if (!walking) renderAvatars();
    renderChat();
    renderBattle();
  },
  async chat(text) { this.apply(await this.call("chat", { text, place: myPlace(), since: this.lastId() })); },
  lastId() { return this.messages.length ? this.messages[this.messages.length - 1].id : 0; },
  async battleOp(op, extra = {}) { this.apply(await this.call("battle", Object.assign({ op, place: myPlace(), since: this.lastId() }, extra))); },
  async saveProfile(p) { return this.call("saveProfile", p); },
  async loadProfile() { return this.call("getProfile", {}); }
};

// ── 對戰畫面 ──
const handledBattles = new Set();
let battleTick = null;
function renderBattle() {
  const b = net.battle;
  const modal = document.getElementById("battle-modal");
  const box = document.getElementById("battle-content");
  // 狀態沒變就不重畫（不然每 4 秒同步一次，畫面會一直跳回最上面）
  const sig = b ? [b.id, b.status, b.myAnswered, b.oppAnswered].join("|") : "";
  if (sig && sig === renderBattle.sig && modal.classList.contains("open")) return;
  renderBattle.sig = sig;
  clearInterval(battleTick);
  if (!b) { modal.classList.remove("open"); return; }
  const opp = b.a === session.user.name ? b.b : b.a;
  const oppInfo = net.others.find(o => o.name === opp) || {};
  const oppFace = avatarFace(oppInfo.emoji || "🙂", oppInfo.color);
  const vs = `<div class="vs-row"><div>${avatarFace(myEmoji(), myColor())}<b>我</b></div><span class="vs">VS</span><div>${oppFace}<b>${escapeHtml(shortName(opp))}</b></div></div>`;
  const countdown = (sec, id) => {
    let left = Math.max(0, Math.round(sec));
    const tick = () => { const el = document.getElementById(id); if (el) el.textContent = left; left = Math.max(0, left - 1); };
    tick();
    battleTick = setInterval(tick, 1000);
  };

  if (b.status === "pending" && b.b === session.user.name) {
    box.innerHTML = `<h2 style="margin-top:0;">⚔️ 有人找你比賽！</h2>${vs}
      <p><b>${escapeHtml(shortName(b.a))}</b> 邀請你來一場知識對決！答對 <b>+${SCORE_RULES.battleOk}</b>，答錯 <b>${SCORE_RULES.battleWrong}</b>。</p>
      <div class="battle-timer">⏳ <span id="bt-left"></span> 秒內回應</div>
      <div style="display:flex; gap:8px;"><button class="btn-success" style="flex:1; padding:12px;" onclick="net.battleOp('respond', { id: '${b.id}', accept: true })">接受挑戰！</button>
      <button class="btn-ghost" style="flex:1;" onclick="net.battleOp('respond', { id: '${b.id}', accept: false })">下次再說</button></div>`;
    countdown(b.left / 1000, "bt-left");
  } else if (b.status === "pending") {
    box.innerHTML = `<h2 style="margin-top:0;">⚔️ 等待對手接受…</h2>${vs}<div class="battle-timer">⏳ <span id="bt-left"></span> 秒</div>
      <button class="btn-ghost" style="width:100%;" onclick="net.battleOp('cancel', { id: '${b.id}' })">取消邀請</button>`;
    countdown(b.left / 1000, "bt-left");
  } else if (b.status === "active") {
    if (b.myAnswered) {
      box.innerHTML = `<h2 style="margin-top:0;">⚔️ 已經作答！</h2>${vs}<p style="text-align:center">等 ${escapeHtml(shortName(opp))} 作答中… ${b.oppAnswered ? "（他也答完了，馬上揭曉！）" : ""}</p><div class="battle-timer">⏳ <span id="bt-left"></span> 秒</div>`;
    } else {
      box.innerHTML = `<h2 style="margin-top:0;">⚔️ 知識對決！</h2>${vs}
        <div class="battle-timer">⏳ 剩 <span id="bt-left"></span> 秒 ${b.oppAnswered ? "・對手已經答完了！" : ""}</div>
        <div style="font-size:.8rem; color:var(--ink-soft)">${escapeHtml(b.q.subject)}・${escapeHtml(b.q.unit)}</div>
        <h3 style="white-space:pre-line; line-height:1.6;">${escapeHtml(b.q.q)}</h3>
        ${b.q.opts.map((o, i) => `<button class="option-btn" onclick="this.disabled=true; net.battleOp('answer', { id: '${b.id}', choice: ${i} })">${CIRCLED[i]}${escapeHtml(o)}</button>`).join("")}`;
    }
    countdown(b.left / 1000, "bt-left");
  } else if (b.status === "done") {
    const me = b.a === session.user.name ? b.result.a : b.result.b;
    const them = b.a === session.user.name ? b.result.b : b.result.a;
    const line = (who, r) => `<div class="q-row"><b>${who}</b>：${r.choice == null ? "沒有作答" : CIRCLED[r.choice] + escapeHtml(b.q.opts[r.choice])}
      <span class="chip ${r.ok ? "green" : "red"}">${r.ok ? "答對" : "答錯"}</span> <span class="pts ${r.pts >= 0 ? "plus" : "minus"}">${fmtPts(r.pts)}</span></div>`;
    box.innerHTML = `<h2 style="margin-top:0;">${me.ok && them.ok ? "🤝 兩個人都答對！一起加分！" : me.ok ? "🏆 你贏了！" : them.ok ? "😵 這次輸了，下次再來！" : "😅 兩個人都答錯…"}</h2>${vs}
      <h3 style="white-space:pre-line; line-height:1.6; font-size:1rem;">${escapeHtml(b.q.q)}</h3>
      ${line("我", me)}${line(escapeHtml(shortName(opp)), them)}
      <div class="lore-box">✔ 正確答案：<b>${CIRCLED[b.result.ans]}${escapeHtml(b.q.opts[b.result.ans])}</b>${b.q.exp ? `<br>📝 ${escapeHtml(b.q.exp)}` : ""}</div>
      ${isTrial() ? "" : `<div style="font-size:.8rem; color:var(--ink-soft)">${me.ok ? "" : "這題已經加進你的錯題本。"}</div>`}
      <button class="btn-primary" style="width:100%; padding:12px;" onclick="net.battleOp('ack', { id: '${b.id}' })">好！繼續冒險</button>`;
    if (!handledBattles.has(b.id)) {
      handledBattles.add(b.id);
      if (session.user.role === "student") {
        myRows.push({ t: b.result.t || nowStr(), subject: b.q.subject, unit: b.q.unit, qId: b.q.id, q: b.q.q, opts: b.q.opts,
          chosen: me.choice == null ? "（沒有作答）" : b.q.opts[me.choice], correctText: b.q.opts[b.result.ans], ok: me.ok,
          mode: "對戰", exp: b.q.exp || "", sid: b.id, uid: `bat-${b.id}-${session.user.name}`, pts: me.pts });
        stats = aggregate(myRows, mySessions);
        if (DEMO) store("508_DEMO_DATA_" + session.user.name, { answers: myRows, sessions: mySessions });
        renderPills(); renderSide();
      }
    }
  } else {
    if (!handledBattles.has(b.id + b.status)) {
      handledBattles.add(b.id + b.status);
      toast(b.status === "declined" ? "對方這次不想比賽，下次再約！" : "邀請已過期");
    }
    net.battleOp("ack", { id: b.id }).catch(() => {});
    modal.classList.remove("open");
    return;
  }
  modal.classList.add("open");
}

// ── 示範模式：由兩位「示範同學」扮演線上的同學（正式上線後不會出現） ──
const demo = (() => {
  const BOTS = [
    { name: "508示範同學二", seat: "02", emoji: "🐰", color: "#fecaca" },
    { name: "508示範同學三", seat: "03", emoji: "🦊", color: "#bbf7d0" }
  ];
  const LINES = ["好喔！", "我剛剛在錯題島複習完 💪", "要不要來比一場？", "這單元好難 😵", "我搭飛機過來的 ✈️", "加油加油！"];
  const st = { places: {}, msgs: [], battle: null, nextBotChallenge: Date.now() + 25000 };
  const bots = () => BOTS.filter(b => b.name !== session.user.name);
  const allPlaces = () => {
    const list = ["W:BOSS", ...WORLD.filter(s => s.units.length).map(s => "W:" + s.key)];
    WORLD.forEach(s => s.units.forEach(u => list.push("U:" + u.key)));
    return list;
  };
  const botSay = (bot, text) => st.msgs.push({ id: Date.now() + Math.random(), name: bot.name, emoji: bot.emoji, color: bot.color, role: "student", text, t: nowStr() });
  const snapshot = (since) => {
    const b = st.battle;
    let battle = null;
    if (b) {
      const now = Date.now();
      if (b.status === "pending" && now > b.until) b.status = "expired";
      if (b.status === "active" && now > b.until) resolve(b);
      battle = Object.assign({}, b, { left: Math.max(0, b.until - now), myAnswered: b.ans[session.user.name] != null,
        oppAnswered: b.ans[b.a === session.user.name ? b.b : b.a] != null, q: b.q && Object.assign({}, b.q, { ans: undefined }) });
    }
    return {
      others: bots().map(bot => Object.assign({}, bot, { place: st.places[bot.name] })),
      messages: st.msgs.filter(m => m.id > since), battle
    };
  };
  function resolve(b) {
    const R = SCORE_RULES, res = { ans: b.q.ans, t: nowStr() };
    ["a", "b"].forEach(k => { const c = b.ans[b[k]]; const ok = c === b.q.ans; res[k] = { choice: c == null ? null : c, ok, pts: ok ? R.battleOk : R.battleWrong }; });
    b.result = res; b.status = "done";
  }
  function pickQuestion(subject) {
    let pool = BANK.filter(q => (!subject || q.subject === subject) && !q.passage);
    const v = VIRTUAL_UNITS.filter(x => x.subject === subject);
    if (v.length && (!pool.length || Math.random() < 0.4)) pool = [pickRandom(v).gen()];
    const q = prepareQuestion(pickRandom(pool.length ? pool : BANK.filter(x => !x.passage)));
    return { id: q.id, subject: q.subject, unit: q.unit, q: q.q, opts: q.opts.map(stripNum), ans: q.ans, exp: q.exp };
  }
  function botAnswerLater(b, bot) {
    setTimeout(() => { if (st.battle === b && b.status === "active") { b.ans[bot.name] = Math.random() < 0.65 ? b.q.ans : (b.q.ans + 1) % b.q.opts.length; if (b.ans[session.user.name] != null) resolve(b); } }, 2500 + Math.random() * 4000);
  }
  return {
    presence({ place, since }) {
      bots().forEach(bot => {
        if (!st.places[bot.name] || Math.random() < 0.2) st.places[bot.name] = Math.random() < 0.45 ? place : pickRandom(allPlaces());
      });
      if (!st.battle && session.user.role === "student" && Date.now() > st.nextBotChallenge) {
        const bot = bots().find(b => st.places[b.name] === place);
        if (bot) {
          st.battle = { id: uid(), a: bot.name, b: session.user.name, status: "pending", until: Date.now() + 20000, ans: {}, subject: view.subject };
          st.nextBotChallenge = Date.now() + 90000;
        }
      }
      return snapshot(since);
    },
    chat({ text, since }) {
      st.msgs.push({ id: Date.now(), name: session.user.name, emoji: myEmoji(), color: myColor(), role: session.user.role, text, t: nowStr() });
      const bot = pickRandom(bots());
      if (bot) setTimeout(() => botSay(bot, text.includes("@" + shortName(bot.name)) ? "嗨嗨！👋" : pickRandom(LINES)), 1800);
      return snapshot(since);
    },
    battle({ op, to, id, accept, choice, since, subject }) {
      const me = session.user.name;
      if (op === "challenge") {
        const bot = bots().find(b => b.name === to);
        if (!bot) throw new Error("找不到這位同學");
        const b = st.battle = { id: uid(), a: me, b: to, status: "pending", until: Date.now() + 20000, ans: {} };
        setTimeout(() => {
          if (st.battle !== b || b.status !== "pending") return;
          if (Math.random() < 0.9) { b.status = "active"; b.q = pickQuestion(subject); b.until = Date.now() + 25000; botAnswerLater(b, bot); }
          else b.status = "declined";
        }, 1500);
      } else if (op === "respond" && st.battle && st.battle.id === id) {
        const b = st.battle;
        if (accept) { b.status = "active"; b.q = pickQuestion(b.subject); b.until = Date.now() + 25000; botAnswerLater(b, BOTS.find(x => x.name === b.a)); }
        else b.status = "declined";
      } else if (op === "answer" && st.battle && st.battle.id === id && st.battle.status === "active") {
        const b = st.battle;
        if (b.ans[me] == null) b.ans[me] = choice;
        const opp = b.a === me ? b.b : b.a;
        if (b.ans[opp] != null) resolve(b);
      } else if (op === "cancel" && st.battle && st.battle.id === id) {
        st.battle = null;
      } else if (op === "ack" && st.battle && st.battle.id === id) {
        st.battle = null;
      }
      return snapshot(since);
    },
    saveProfile(p) { store("508_DEMO_PROFILE_" + session.user.name, p); return { ok: true }; },
    getProfile() { return { profile: load("508_DEMO_PROFILE_" + session.user.name, null) }; }
  };
})();

  const wrongs = yes ? [`Yes, ${pron} ${third ? "do" : "does"}.`, `Yes, ${pron} is.`, `No, ${pron} ${third ? "doesn’t" : "don’t"}.`] : [`No, ${pron} ${third ? "don’t" : "doesn’t"}.`, `No, ${pron} isn’t.`, `Yes, ${pron} ${third ? "does" : "do"}.`];
  return genQ("英語", EU1, "句型 Do / Does", `A: ${third ? "Does" : "Do"} ${s} like ${d}?\nB: ${yes ? "（喜歡）" : "（不喜歡）"} ＿＿＿＿`, ansText, wrongs,
    `${third ? "Does" : "Do"} 開頭的問句，回答也用 ${third ? "does / doesn’t" : "do / don’t"}：${ansText}`);
}
function genEnglish2() {
  const r = Math.random();
  if (r < 0.4) return genVocab(EU2, FRUITS);
  const [f] = pickRandom(FRUITS), single = f.replace(/s$/, "");
  if (r < 0.65) {
    const third = Math.random() < 0.5, s = pickRandom(third ? SUBJ3 : SUBJP), n = randInt(2, 9);
    return genQ("英語", EU2, "句型 need / needs", `${s} ＿＿＿ ${numWord(n)} ${f}.`, third ? "needs" : "need", third ? ["need", "needing", "is need"] : ["needs", "needing", "is need"],
      third ? `${s} 是第三人稱單數，用 needs。` : `${s} 用 need。`);
  }
  if (r < 0.85) {
    const n = randInt(2, 9), art = /^[aeiou]/.test(single) ? "an" : "a";
    return genQ("英語", EU2, "單複數", "下列哪一句是正確的？", `I need ${numWord(n)} ${f}.`,
      [`I need ${numWord(n)} ${single}.`, `I need ${art} ${f}.`, `She need ${numWord(n)} ${f}.`],
      `兩個以上要用複數 ${f}；一個用 ${art} ${single}；主詞 She 要用 needs。`);
  }
  return genQ("英語", EU2, "句型 How many", `A: ＿＿＿ ${f} do you need?\nB: I need four ${f}.`, "How many", ["How much", "What", "Where"], "問「幾個」要用 How many，後面接複數名詞。");
}

function virtualOf(unit) { return VIRTUAL_UNITS.find(v => v.subject === unit.subject && v.unit === unit.unit); }
function generateVirtual(v, n, used) {
  const out = [], ids = new Set(used);
  for (let i = 0; i < n * 15 && out.length < n; i++) {
    const q = v.gen();
    if (q && !ids.has(q.id) && new Set(q.opts).size === q.opts.length) { ids.add(q.id); out.push(q); }
